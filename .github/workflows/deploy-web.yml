# Builds the web app and publishes it on the gh-pages branch (GitHub Pages:
# https://app.batinode.be). The Supabase URL and anon key are public.
name: Deploy web app

on:
  push:
    branches: [signup-conversion]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://bkmzstdviytslegbxsax.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrbXpzdGR2aXl0c2xlZ2J4c2F4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMjU1NTYsImV4cCI6MjEwNzkwMTU1Nn0.ktDieGxIQz9w5zCcGlAYO_AwRHln_mkJHx9U9aAGEcI
      EXPO_PUBLIC_APP_URL: https://app.batinode.be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web
      # Pages cannot send security headers, so the policy goes in the page itself.
      - run: node scripts/add-csp.mjs dist/index.html
      # Pages has no rewrites: unknown paths get 404.html, which is the app itself.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          cname: app.batinode.be
