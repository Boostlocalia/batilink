# Deploys the server functions to Supabase on every push that changes them.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens).
name: Deploy Supabase functions

on:
  push:
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: bkmzstdviytslegbxsax
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
