project_id = "batilink"

[api]
schemas = ["public"]

[auth]
site_url = "http://localhost:8081"
additional_redirect_urls = ["batilink://"]

[auth.email]
enable_signup = true
otp_length = 6

# Sign-in e-mails in the user's language (user metadata "language", kept in sync with profiles.language). Paste the same subject and file into
# Supabase → Authentication → Email Templates for the hosted project.
[auth.email.template.confirmation]
subject = "{{ if eq (printf \"%v\" .Data.language) \"nl\" }}Bevestig uw e-mailadres{{ else }}Confirmez votre adresse{{ end }} · Batinode"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "{{ if eq (printf \"%v\" .Data.language) \"nl\" }}Uw nieuwe wachtwoord{{ else }}Votre nouveau mot de passe{{ end }} · Batinode"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "{{ if eq (printf \"%v\" .Data.language) \"nl\" }}Uw aanmeldlink{{ else }}Votre lien de connexion{{ end }} · Batinode"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "{{ if eq (printf \"%v\" .Data.language) \"nl\" }}Bevestig uw nieuwe adres{{ else }}Confirmez votre nouvelle adresse{{ end }} · Batinode"
content_path = "./supabase/templates/email_change.html"

# Suppliers open their reply link without an account.
[functions.supplier-quote]
verify_jwt = false

# Called by the cron job with its own shared secret.
[functions.remind-suppliers]
verify_jwt = false

# Called by the mail provider with its own shared secret.
[functions.inbound-email]
verify_jwt = false

# Signed-in users (JWT checked in the function) and the cron job (shared secret).
[functions.verify-company]
verify_jwt = false

# Suppliers use the assistant from their link (token checked in the function).
[functions.assistant]
verify_jwt = false

# Suppliers open their order link without an account (token checked in the function).
[functions.supplier-order]
verify_jwt = false

# Called by Stripe; every call is checked against its signature.
[functions.stripe-webhook]
verify_jwt = false

# Cron job (shared secret) and the payment link in the supplier e-mail (token).
[functions.bill-commissions]
verify_jwt = false

# Daily cron job, authenticated by x-cron-secret.
[functions.lifecycle]
verify_jwt = false
